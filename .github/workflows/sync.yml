name: Sync plugin catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  repository_dispatch:
    types: [sync-catalog]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Merge plugin repo.json files
        run: |
          python3 << 'PY'
          import json, urllib.request
          urls = [
            "https://raw.githubusercontent.com/ShadowstarIO/LightsOn/main/repo.json",
            "https://raw.githubusercontent.com/ShadowstarIO/StatusShift/main/repo.json",
            "https://raw.githubusercontent.com/ShadowstarIO/AndThen/main/repo.json",
            "https://raw.githubusercontent.com/ShadowstarIO/Starflow/star/repo.json",
          ]
          # Entries already listed, kept when their source can't be reached.
          current = {e.get("InternalName"): e for e in json.load(open("repo.json", encoding="utf-8"))}
          out = []
          seen = set()
          for url in urls:
              try:
                  with urllib.request.urlopen(url) as r:
                      data = json.load(r)
              except Exception as e:
                  # A private or missing repo keeps its current listing and does not hold back the others.
                  print(f"kept current entry for {url}: {e}")
                  name = url.split("/")[4]
                  data = [current[name]] if name in current else []
              if isinstance(data, dict):
                  data = [data]
              for entry in data:
                  name = entry.get("InternalName")
                  if not name or name in seen:
                      continue
                  seen.add(name)
                  # Stay on the testing channel until the install version catches up.
                  if name in ("AndThen", "Starflow") and entry.get("TestingAssemblyVersion") != entry.get("AssemblyVersion"):
                      entry["IsTestingExclusive"] = True
                  out.append(entry)
          out.sort(key=lambda e: (e.get("Name") or "").lower())
          open("repo.json", "w", encoding="utf-8").write(json.dumps(out, indent=2) + "\n")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet || git commit -m "sync plugin catalog"
          git push
