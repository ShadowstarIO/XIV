name: Sync plugin catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  repository_dispatch:
    types: [sync-catalog]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Merge plugin repo.json files
        run: |
          python3 << 'PY'
          import json, urllib.request
          urls = [
            "https://raw.githubusercontent.com/ShadowstarIO/LightsOn/main/repo.json",
            "https://raw.githubusercontent.com/ShadowstarIO/StatusShift/main/repo.json",
            "https://raw.githubusercontent.com/ShadowstarIO/AndThen/main/repo.json",
          ]
          out = []
          seen = set()
          for url in urls:
              with urllib.request.urlopen(url) as r:
                  data = json.load(r)
              if isinstance(data, dict):
                  data = [data]
              for entry in data:
                  name = entry.get("InternalName")
                  if not name or name in seen:
                      continue
                  seen.add(name)
                  # Stay on the testing channel until the install version catches up.
                  if name == "AndThen" and entry.get("TestingAssemblyVersion") != entry.get("AssemblyVersion"):
                      entry["IsTestingExclusive"] = True
                  out.append(entry)
          out.sort(key=lambda e: (e.get("Name") or "").lower())
          open("repo.json", "w", encoding="utf-8").write(json.dumps(out, indent=2) + "\n")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet || git commit -m "sync plugin catalog"
          git push
