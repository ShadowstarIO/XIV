    <clipPath id="lit">
      <rect x="0" y="0" width="256" height="512"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="#1C1C1E"/>
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>

